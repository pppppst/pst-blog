    **天气之子**
    最近项目上不太顺利，生活上也有点难说，但天气似乎还是眷顾了我。
    周一下午从家拖着行李箱回到了学校，到达宿舍没几分钟后，窗外下起了大雨。呼，躲过一劫。
    昨天傍晚肉眼看着天气较晴，但刚从学院大楼出来打算去跑步时，发现下着很小的雨，不仅是强度，密度也很小，于是还是去跑步了。跑不动了开始放松走走，意外看到彩虹，起初以为只有右边一道，转头发现左边也有，大惊。再一抬头，原来是有完成的180°彩虹桥！不可谓不是天气眷顾了我啊><
    ![彩虹右](/img/2026-09-02_rainbow1.jpg)
    ![彩虹左](/img/2026-09-02_rainbow2.jpg)
    ![完整彩虹](/img/2026-09-02_rainbow3.jpg)
    于是分享。
