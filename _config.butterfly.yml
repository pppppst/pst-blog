# hexo-theme-butterfly 主题配置覆盖
# 与 themes/butterfly/_config.yml 深度合并（hexo 5+ 原生支持 _config.<theme>.yml），
# 这里只放需要覆盖的少量字段，不动主题文件本身，便于主题升级。

inject:
  # RSS autodiscovery：官方 feed 插件停用后由 scripts/atom-feed.js 生成 atom.xml，
  # 插件原本的 autodiscovery 注入也随之失效，在这里手动补回
  head:
    - <link rel="alternate" type="application/atom+xml" title="pst's Blog" href="/atom.xml">
  # 页面底部注入的脚本：让文章正文与碎碎念里的链接在新标签页打开
  bottom:
    - <script src="/js/fix-link-target.js"></script>

aside:
  display:
    # /blog/ 文章流（原首页）不显示右侧栏
    home: false
    archive: false
    tag: false
    category: false
  # 保留分类功能与分类卡片
  card_categories:
    enable: true

# 评论使用发布仓 pppppst/pppppst.github.io 的 GitHub Discussions。
# 分类固定为 Announcements，避免访客直接创建与页面无关的讨论主题。
comments:
  use: Giscus

giscus:
  repo: pppppst/pppppst.github.io
  repo_id: R_kgDORqPB-A
  category_id: DIC_kwDORqPB-M4DEyrY
