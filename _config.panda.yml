            url('/img/home-img.webp') !important;
          background-size: cover;
          background-position: center;
        }

        #body-wrap.type-landing #site-title {
          display: none !important;
        }

        #body-wrap.type-landing #site-subtitle {
          font-family: "Zhuque Fangsong", "FangSong", "STFangsong", serif;
          font-size: clamp(1.4rem, 4.5vw, 4rem);
        }

        #page-header.post-bg {
          background-image: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
          background-size: cover;
          background-position: center;
        }

        #page-header.not-home-page {
          background-image:
            linear-gradient(rgba(20, 30, 50, 0.25), rgba(20, 30, 50, 0.25)),
            url('/img/home-img.webp') !important;
          background-size: cover;
          background-position: center;
        }

        #page-header.not-top-img {
          background: linear-gradient(135deg, #4facfe 0%, #6ec6ff 25%, #a18cd1 55%, #fbc2eb 75%, #ffd2a8 100%) !important;
        }

        #page-header.full_page:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #page-header.post-bg:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #page-header.not-home-page:before,
        #page-header.not-top-img:before {
          background: linear-gradient(180deg, rgba(26, 73, 118, 0.08) 0%, rgba(60, 66, 122, 0.16) 100%) !important;
        }

        #web_bg {
